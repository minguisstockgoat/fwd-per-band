name: daily-update

on:
  schedule:
    # 08:10 KST (전 영업일 종가 + FnGuide 전일자 기준 컨센서스가 모두 확정된 시각)
    # UTC 일~금 = KST 월~토. 토요일 실행이 있어야 금요일 종가가 월요일까지 밀리지 않는다.
    - cron: "10 23 * * 0-5"
  workflow_dispatch:
    inputs:
      skip_consensus:
        description: "컨센서스 크롤링 없이 시세만 갱신"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 누적 업데이트 (KRX 종가 + FnGuide Fwd.12M 컨센서스)
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          python scripts/daily_update.py ${{ inputs.skip_consensus && '--skip-consensus' || '' }}

      - name: 정적 데이터 재생성
        run: python scripts/build_site.py

      - name: 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "변경 없음"
          else
            git add raw/master.json docs/data
            # 실행일이 아니라 데이터 기준일로 남긴다 (밀림 진단 시 헷갈리지 않게)
            git commit -m "data: $(python -c "import json;print(json.load(open('raw/master.json'))['dates'][-1])") 기준"
            git push
          fi

      # 조용한 실패 방지 — 데이터가 밀렸으면 워크플로를 실패로 끝낸다
      - name: 신선도 확인
        run: python scripts/check_freshness.py
